<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Safva</title>
<meta name="description" content="Get in touch with Safva.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6;
    --text: #15181D;
    --accent: #35415C;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.08;
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 480px;
    width: 100%;
  }
  .mark {
    width: 40px;
    height: 40px;
    margin: 0 auto 18px;
    display: block;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(26px, 6vw, 34px);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  p.lead {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  form {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    display: block;
  }
  input, textarea {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--text);
    background: #fff;
    border: 1px solid rgba(21,24,29,0.14);
    border-radius: 10px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 110px;
  }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s ease;
  }
  button:hover {
    opacity: 0.9;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .status {
    font-size: 14px;
    margin-top: 14px;
    display: none;
  }
  .status.ok {
    color: #2E7D46;
    display: block;
  }
  .status.err {
    color: #B3261E;
    display: block;
  }
  .back {
    display: inline-block;
    margin-top: 26px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
  }
  .back:hover {
    color: var(--accent);
  }
  /* honeypot field, hidden from real visitors */
  .hp {
    position: absolute;
    left: -9999px;
    top: -9999px;
  }
</style>
</head>
<body>
  <img class="bg" src="assets/home-background.jpg" alt="">
  <main>
    <img class="mark" src="assets/favicon.svg" alt="Safva logo">
    <h1>Get in touch</h1>
    <p class="lead">Reach out about a role, a project, or a question — I read every message.</p>

    <form id="contact-form">
      <input type="hidden" name="access_key" value="552805d7-ab33-4958-8865-803f20d3ca69">
      <input type="hidden" name="subject" value="New message from safva-portfolio.github.io">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" id="submit-btn">Send message</button>
      <div class="status" id="status"></div>
    </form>

    <a class="back" href="index.html">&larr; Back to home</a>
  </main>

  <script>
    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      statusEl.className = 'status';
      statusEl.textContent = '';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await res.json();

        if (result.success) {
          statusEl.textContent = "Thanks — your message is on its way. I'll get back to you soon.";
          statusEl.className = 'status ok';
          form.reset();
        } else {
          statusEl.textContent = 'Something went wrong sending that. Please try again in a moment.';
          statusEl.className = 'status err';
        }
      } catch (err) {
        statusEl.textContent = 'Network error — please try again, or reach out via LinkedIn instead.';
        statusEl.className = 'status err';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send message';
      }
    });
  </script>
</body>
</html>
