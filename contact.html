  /* honeypot field, hidden from real visitors */

  <script>
    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      statusEl.className = 'status';
      statusEl.textContent = '';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await res.json();

        if (result.success) {
          statusEl.textContent = "Thanks — your message is on its way. I'll get back to you soon.";
          statusEl.className = 'status ok';
          form.reset();
        } else {
          statusEl.textContent = 'Something went wrong sending that. Please try again in a moment.';
          statusEl.className = 'status err';
        }
      } catch (err) {
        statusEl.textContent = 'Network error — please try again, or reach out via LinkedIn instead.';
        statusEl.className = 'status err';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send message';
      }
    });
  </script>
