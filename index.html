<style>

    --bg: #FAF9F6;
    --text: #15181D;
    --accent: #35415C;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.08;
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
  }
  .mark {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 16px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .building {
    font-size: 14px;
    color: var(--text);
    margin: -8px 0 24px;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 8px;
    margin: 0 0 24px;
  }
  .links a, .links .soon {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(21,24,29,0.12);
  }
  .links a {
    color: var(--accent);
  }
  .links a:hover {
    background: rgba(53,65,92,0.08);
  }
  .links .soon {
    color: var(--muted);
    opacity: 0.55;
    cursor: default;
  }
