<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safva</title>
<meta name="description" content="Safva — I build usable AI products, not just models in a notebook.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F6;
    --text: #15181D;
    --accent: #35415C;
    --muted: #6B7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.08;
    pointer-events: none;
  }
  main {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
  }
  .mark {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 16px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .note {
    font-size: 13px;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <img class="bg" src="assets/home-background.png" alt="">
  <main>
    <img class="mark" src="assets/favicon.svg" alt="Safva logo">
    <h1>Safva</h1>
    <p>I build usable AI products — not just models in a notebook.</p>
    <div class="note">Portfolio in progress — check back soon.</div>
  </main>
</body>
</html>
